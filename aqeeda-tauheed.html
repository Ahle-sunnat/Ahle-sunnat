  <header><h1>Aqeeda: Tauheed (Oneness of Allah)</h1></header>
  <div class="content">
    <p><strong>Roman Urdu:</strong> Humara aqeeda hai ke Allah Ta'ala wahid o la shareek hai. Na uska koi shareek hai na kabhi hoga.</p>
    <p><strong>English Translation:</strong> Our belief is that Allah Almighty is One and has no partners — neither now nor ever.</p>
